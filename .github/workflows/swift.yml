name: Swift CI

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Show Swift version
      run: swift --version

    - name: Resolve dependencies
      run: swift package resolve

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v

  swiftlint:
    name: SwiftLint
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install SwiftLint
      run: |
        brew install swiftlint
        swiftlint --version

    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging

